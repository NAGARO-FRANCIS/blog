<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Activez votre compte</title>
</head>
<body>
  <p>Bonjour {{ user.get_full_name|default:user.username }},</p>
  <p>Merci pour votre inscription sur {{ site_name }}.</p>
  <p>Veuillez cliquer sur le lien ci-dessous pour activer votre compte :</p>

  <p>Si vous n'êtes pas à l'origine de cette inscription, vous pouvez ignorer cet email.</p>
</body>
</html>
